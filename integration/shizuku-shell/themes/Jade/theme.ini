; ShizukuOS native port of licensed B00merang CSS colour recipes; no Microsoft artwork.
; Opaque gradients and Noto Sans KR are implemented; alpha, blur and animation stay disabled.
; Native sound uses bounded asynchronous PlaySound; accepted does not prove completed playback.

[meta]
schema=1
name=Jade
description=Longhorn Jade palette (B00merang CSS)
kind=builtin

[window]
border_width=1
padding=6
corner_radius=0
shadow=0

[titlebar]
nonclient=0
height=32
align=left
active_top=#F0F0F0
active_bottom=#F0F0F0
inactive_top=#F0F0F0
inactive_bottom=#F0F0F0
text_active=#000000
text_inactive=#000000
buttons=flat

[border]
