; ShizukuDOS unattended setup answer file (SHZSETUP.EXE), schema 1.
; Packed as \SHZ\SETUP\SHZSETUP.INI in INSTALL.IMG by install/mkpayload.py (--answer picks another file).
; Syntax: [Section], Key=Value, ';' or '#' comments (also after a value, preceded by a space). Names are
; case-insensitive; unknown keys are reported in the log and ignored. See docs/shizukudos10/INSTALLER.md.

[Setup]
Schema=1
; Required consent: SHZSETUP erases the selected disk completely. Anything else refuses to run.
Confirm=ERASE-TARGET
; After a successful or failed run: shutdown (default) | reboot | none
Reboot=shutdown

[Target]
; Which disk (whole devices only, 512-byte sectors, writable, large enough):
;   first | first-nvme | first-ahci | first-mmc | first-ram | largest | smallest
;   size   (SizeMiB=<exact capacity in MiB>)
;   serial (Serial=<driver-reported serial number>)
;   name   (Name=<kernel device name, e.g. nvme0n1, ahci0, ram0>)
Select=first
SizeMiB=
Serial=
Name=
; Disks smaller than this are not eligible (0 = only the layout's own minimum).
MinSizeMiB=0
; A disk that already has an MBR/GPT partition table is refused unless this is yes.
AllowNonEmpty=no

[Layout]
; p1 = EFI System Partition (fixed size, from the payload's esp.img), p2 = ShizukuFS system volume,
; p3 = optional empty FAT32 volume for the user's own Windows 98 (Windows 98 is never bundled).
; SystemMiB=0: p2 takes the rest of the disk (after reserving Win98MiB). Minimum 64.
SystemMiB=0
; 0 = no Windows 98 partition; otherwise >= 64 (FAT32 minimum).
Win98MiB=0
; yes: also describe p3 in the MBR (type 0x0C, hybrid MBR) so a legacy OS that cannot read GPT sees it.
Win98HybridMBR=no
; no: leave the 440 bytes of MBR boot code zero (UEFI-only disk).
BiosBootCode=yes

[System]
; Letters, digits and '-'.
Hostname=SHIZUKU
; Optional: derive every GUID/UUID from this text instead of random numbers (reproducible test installs).
GuidSeed=

[Drivers]
; Driver packages to put under \SHZ\DRIVERS: all | none | comma list (e.g. ahci,nvme,rtl8139).
Install=all
