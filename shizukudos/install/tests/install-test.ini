; Answer file used by shizukudos/tests/run_install.py (packed into INSTALL.IMG for the unattended VM install).
; The target is the 512 MiB QEMU ivshmem RAM disk at PCI 00:05.0; a second one at 00:06.0 must stay untouched.
[Setup]
Schema=1
Confirm=ERASE-TARGET
Reboot=shutdown

[Target]
Select=serial
Serial=IVSHMEM-00:05.0
AllowNonEmpty=no

[Layout]
SystemMiB=0
Win98MiB=64
Win98HybridMBR=no
BiosBootCode=yes

[System]
Hostname=SHZVM
GuidSeed=run_install

[Drivers]
Install=all
