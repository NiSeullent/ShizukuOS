# Static distribution and recorded preview for ShizukuOS.
root /srv/m98/current/site;
index index.html;
absolute_redirect off;

# HTML must not retain the old console entry in browser or intermediary caches.
location = / {
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, max-age=0, no-transform" always;
    try_files /index.html =404;
}
location = /index.html {
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, max-age=0, no-transform" always;
    try_files $uri =404;
}
location = /preview.html {
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, max-age=0, no-transform" always;
    try_files $uri =404;
}
location = /preview { return 302 /preview.html; }
location = /en { return 302 /en/; }
location ~ \.html$ {
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, max-age=0, no-transform" always;
    try_files $uri =404;
}

# Old bookmarked console entries now lead to the distribution page.
location = /vnc.html {
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, max-age=0, no-transform" always;
    return 302 /;
}
location = /vnc_lite.html {
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, max-age=0, no-transform" always;
    return 302 /;
}

# Preserve the running compatibility VM under an explicit separate URL.
# This VM is distinct from the preserved ShizukuOS Windows 98 GOP acceptance runs.
location = /legacy-console { return 302 /legacy-console/; }
location = /legacy-console/ {
    return 302 /legacy-console/vnc.html?path=legacy-console/websockify;
}
location ^~ /legacy-console/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $nyase_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nyase_connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_redirect off;
    proxy_pass http://127.0.0.1:6080/;
}

# An already connected legacy console may continue using its old socket URL.
location = /websockify {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nyase_connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:6080;
}

location / {
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, max-age=0, no-transform" always;
    try_files $uri $uri/ =404;
}
