# ShizukuOS — local static distribution and preview.
server {
    listen 80;
    listen [::]:80;
    server_name m98.nyase.kr;
    include /srv/conf.d/nginx/snippets/cloudflare-flexible.conf;
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    if ($nyase_forwarded_proto != https) {
        return 301 https://m98.nyase.kr$request_uri;
    }
    include /srv/m98/nginx/locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m98.nyase.kr;
    ssl_certificate /srv/conf.d/ssl/server.crt;
    ssl_certificate_key /srv/conf.d/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    include /srv/conf.d/nginx/snippets/security-headers.conf;
    client_max_body_size 1m;
    include /srv/m98/nginx/locations.conf;
}
