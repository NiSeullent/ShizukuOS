# SPDX-License-Identifier: GPL-2.0-only
name: Native provider PE32 and SDK ABI build

'on':
  push:
    branches: [codex/theme-integration-6970]
    paths:
      - .github/workflows/native-provider-pe32-6970.yml
      - ntwin32/legacy_provider_bridge/build_native_pe32_guarded_6970.py
      - ntwin32/legacy_provider_bridge/sspi_sdk_abi_6970.c
      - ntwin32/legacy_provider_bridge/native.c
      - ntwin32/legacy_provider_bridge/table.c
      - ntwin32/legacy_provider_bridge/table.h
      - ntwin32/legacy_provider_bridge/NTWPROV.def
      - ntwin32/legacy_provider_bridge/probe.c
      - ntwin32/legacy_provider_bridge/build.py
      - ntwin32/legacy_provider_bridge/pe_link_script_6970.py
      - ntwin32/legacy_provider_bridge/seal_native_handoff_6970.py
      - tools/build_npp_prerequisites.py
      - benchmarks/win98se-ko-oem-native-exports-v1.json
      - ntwin32/secure_transport/i486_gate.py
      - ntwin32/secure_transport/i486_gate_test.py
  workflow_dispatch:
    inputs:
      retain_native_handoff:
        description: Retain verified project PE32 files and their exact source/proof handoff
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-provider-pe32-6970-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-provider-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Prepare bounded tools on the isolated hosted runner
        timeout-minutes: 5
        run: |
          python3 -B - <<'PYTHON'
          import os, shutil, stat
          from pathlib import Path
          root = Path.cwd().resolve()
          assert shutil.disk_usage(root).free >= 20 * 1024**3 + 1024**3
          # The ordinary runner retains writable namespace parents. Sudo may
          # create only its private preparation child, never the shared build parent.
          for parent in (root / 'build', root / 'build/native-provider-pe32-prep-6970',
                         root / 'build/native-provider-pe32-6970'):
              for component in (parent, *parent.parents):
                  assert not component.is_symlink()
              parent.mkdir(mode=0o755, exist_ok=True)
              info = parent.stat(follow_symlinks=False)
              assert stat.S_ISDIR(info.st_mode) and info.st_uid == os.geteuid()
              assert os.access(parent, os.W_OK | os.X_OK)
          assert shutil.disk_usage(root).free >= 20 * 1024**3 + 1024**3
          print('Runner-owned writable namespace parents prepared; no compiler or probe executed.')
          PYTHON
          sudo -n python3 -B - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PYTHON'
          import hashlib, json, os, resource, selectors, shutil, signal, stat
          import subprocess, sys, time
          from pathlib import Path
          root = Path.cwd().resolve()
          run_id, attempt = sys.argv[1:]
          assert run_id.isdigit() and attempt.isdigit() and os.geteuid() == 0
          reserve, budget = 20 * 1024**3, 1024**3
          initial = shutil.disk_usage(root).free
          assert initial >= reserve + budget
          prep = root / 'build/native-provider-pe32-prep-6970' / f'actions-{run_id}-{attempt}'
          assert not prep.exists() and not prep.is_symlink()
          for component in (prep, *prep.parents):
              assert not component.is_symlink()
          prep.mkdir(parents=True, mode=0o755)
          tmp, archives, pydeps = (prep / name for name in ('tmp', 'archives', 'pydeps'))
          tmp.mkdir(mode=0o755)
          archives.mkdir(mode=0o755)
          minimum, captured, records = initial, 0, []
          environment = os.environ.copy()
          environment.update(TMPDIR=str(tmp), TMP=str(tmp), TEMP=str(tmp),
                             PYTHONDONTWRITEBYTECODE='1', PIP_DISABLE_PIP_VERSION_CHECK='1',
                             DEBIAN_FRONTEND='noninteractive')

          def observe(pending=0):
              global minimum
              free = shutil.disk_usage(root).free
              minimum = min(minimum, free)
              if free < reserve + pending or initial - free + pending > budget:
                  raise RuntimeError('Hosted prerequisite reserve or observed 1 GiB change budget crossed')
              return free

          def child_limits():
              resource.setrlimit(resource.RLIMIT_FSIZE, (budget, budget))
              resource.setrlimit(resource.RLIMIT_CORE, (0, 0))

          def run(label, argv):
              global captured
              observe()
              print('Hosted-only prerequisite:', label, argv, flush=True)
              child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT, env=environment,
                                       start_new_session=True, preexec_fn=child_limits)
              watch = selectors.DefaultSelector()
              watch.register(child.stdout, selectors.EVENT_READ)
              output, started = bytearray(), time.monotonic()
              aborted = None
              try:
                  while True:
                      observe()
                      if time.monotonic() - started > 120:
                          raise RuntimeError('Hosted prerequisite command exceeded 120 seconds')
                      status = os.waitid(os.P_PID, child.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                      if status and status.si_pid == child.pid and not watch.get_map():
                          break
                      for key, _ in watch.select(0.05):
                          block = os.read(key.fileobj.fileno(), 16384)
                          if not block:
                              watch.unregister(key.fileobj)
                          else:
                              remaining = 262144 - captured
                              output.extend(block[:remaining])
                              captured += min(len(block), remaining)
                              if len(block) > remaining:
                                  raise RuntimeError('Hosted prerequisite aggregate log exceeded 256 KiB')
                  child.wait(timeout=5)
              except BaseException as error:
                  aborted = str(error)[:2048]
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  child.wait(timeout=5)
                  raise
              finally:
                  watch.close()
                  child.stdout.close()
                  print(output.decode('utf-8', errors='replace'), end='')
                  records.append({'label': label, 'argv': argv, 'exit_code': child.returncode,
                                  'direct_child_reaped': child.returncode is not None,
                                  'aborted': aborted, 'log_bytes': len(output),
                                  'log_sha256': hashlib.sha256(output).hexdigest(),
                                  'elapsed_seconds': time.monotonic() - started})
              assert child.returncode == 0
              observe()

          result, error = 'FAIL', None
          try:
              # No update, upgrade, removal or cache cleanup is performed.
              run('i686-win32-toolchain', [
                  'apt-get', '-o', 'Acquire::Retries=0', '-o', 'DPkg::Lock::Timeout=10',
                  '-o', 'Dir::Cache::archives=' + str(archives),
                  '--no-install-recommends', '--no-upgrade', '--no-remove', '--yes',
                  'install', 'gcc-mingw-w64-i686-win32',
              ])
              run('isolated-pe-parser', [sys.executable, '-B', '-m', 'pip', 'install',
                  '--disable-pip-version-check', '--no-compile', '--no-cache-dir',
                  '--target', str(pydeps), 'pefile==2024.8.26'])
              run('actual-installed-package-versions', [
                  'dpkg-query', '-W', '-f=${Package}\t${Version}\n',
                  'gcc-mingw-w64-i686-win32', 'gcc-mingw-w64-i686-win32-runtime',
                  'binutils-mingw-w64-i686', 'mingw-w64-i686-dev', 'mingw-w64-common',
              ])
              assert shutil.which('i686-w64-mingw32-gcc-win32')
              assert shutil.which('i686-w64-mingw32-objdump')
              assert (pydeps / 'pefile.py').is_file()
              observe()
              assert shutil.disk_usage(root).free >= reserve + 8 * 1024**2
              result = 'PASS_HOSTED_PREREQUISITES_ONLY'
          except BaseException as failure:
              error = str(failure)[:2048]
              raise
          finally:
              # This receipt describes observed disk changes, not a quota or full transient peak.
              destination = prep / 'result.json'
              closure_failure = None

              def receipt_bytes():
                  receipt = {'schema': 'native-provider-hosted-preparation-v1', 'result': result,
                             'error': error, 'reserve_bytes': reserve,
                             'observed_disk_change_budget_bytes': budget,
                             'available_before_bytes': initial,
                             'minimum_observed_free_bytes': minimum,
                             'observed_consumption_upper_sample_bytes': max(0, initial-minimum),
                             'commands': records, 'aggregate_log_bytes': captured,
                             'native_execution_verified': False, 'windows98_integration_verified': False,
                             'filesystem_quota_enforced': False, 'all_transient_peaks_measured': False}
                  encoded = (json.dumps(receipt, indent=2) + '\n').encode()
                  assert len(encoded) <= 65536
                  return encoded

              for closing_attempt in range(4):
                  if result != 'FAIL':
                      try:
                          observe(pending=65536)
                      except BaseException as failure:
                          result, error = 'FAIL', str(failure)[:2048]
                          closure_failure = failure
                  data = receipt_bytes()
                  with destination.open('xb' if closing_attempt == 0 else 'wb') as stream:
                      stream.write(data)
                  if result == 'FAIL':
                      break
                  recorded_minimum = minimum
                  try:
                      observe()
                  except BaseException as failure:
                      result, error = 'FAIL', str(failure)[:2048]
                      closure_failure = failure
                      # Replace our unfrozen candidate with bounded FAIL evidence.
                      data = receipt_bytes()
                      with destination.open('wb') as stream:
                          stream.write(data)
                      break
                  if minimum == recorded_minimum:
                      break
              else:
                  result, error = 'FAIL', 'Hosted preparation receipt minimum did not stabilize'
                  closure_failure = RuntimeError(error)
                  data = receipt_bytes()
                  with destination.open('wb') as stream:
                      stream.write(data)
              print('Preparation receipt SHA256:', hashlib.sha256(data).hexdigest())
              print(data.decode(), end='')
              if closure_failure is not None:
                  raise closure_failure
          PYTHON

      - name: Bind exact revision and fresh counted build root
        run: |
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import os, re, subprocess
          root = Path.cwd().resolve()
          expected = os.environ['GITHUB_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', expected) and actual == expected
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          assert run_id.isdigit() and attempt.isdigit()
          proof = root / 'build/native-provider-pe32-6970' / f'actions-{run_id}-{attempt}'
          prep = root / 'build/native-provider-pe32-prep-6970' / f'actions-{run_id}-{attempt}'
          assert not proof.exists() and (prep / 'pydeps/pefile.py').is_file()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PMA_PROVIDER_PE32_PROOF={proof}\n')
              stream.write(f'PMA_PROVIDER_PE32_PREP={prep}\n')
              stream.write(f'PYTHONPATH={prep / "pydeps"}\n')
          print(f'Exact checkout {actual}; new counted build proof {proof}')
          PYTHON

      - name: Build actual bridge and verify real SDK ABI and linked instructions
        run: |
          python3 -B ntwin32/legacy_provider_bridge/build_native_pe32_guarded_6970.py --output-root "$PMA_PROVIDER_PE32_PROOF"

      - name: Record bounded actual build receipt
        if: always()
        run: |
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os, stat
          value = os.environ.get('PMA_PROVIDER_PE32_PROOF')
          if not value:
              print('Preparation did not finish; no native build result adopted.')
              raise SystemExit(0)
          root, proof = Path.cwd().resolve(), Path(value)
          assert proof.parent == root / 'build/native-provider-pe32-6970'
          path = proof / 'result.json'
          if not path.exists():
              print('No counted receipt; no build or ABI result adopted.')
              raise SystemExit(0)
          assert not path.is_symlink()
          info = path.stat()
          assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 262144
          data = path.read_bytes()
          result = json.loads(data)
          print('Build receipt SHA256:', hashlib.sha256(data).hexdigest())
          print(data.decode(), end='')
          incomplete_failure = (
              result.get('result') == 'FAIL'
              and result.get('receipt_accounting_verified') is False
              and isinstance(result.get('error'), str)
              and (set(result) == {'result', 'receipt_accounting_verified', 'error'}
                   or result.get('schema') == 'native-provider-pe32-build-invalid-receipt-v1')
          )
          if incomplete_failure:
              print('Incomplete failure receipt; no successful result adopted.')
          else:
              for key in ('native_execution_verified', 'windows98_integration_verified',
                          'network_execution_verified', 'credential_execution_verified',
                          'os_tls_provider_verified', 'os_registration_verified',
                          'kernel64_backend_verified', 'application_compatibility_verified'):
                  assert result[key] is False
          # Print counted diagnostics here. The separate opt-in handoff below
          # retains only explicit source-built project files, never Windows media.
          captured = 0
          for capture in sorted([*proof.glob('*.stdout'), *proof.glob('*.stderr')]):
              assert not capture.is_symlink()
              size = capture.stat().st_size
              assert stat.S_ISREG(capture.stat().st_mode) and capture.stat().st_nlink == 1 and size <= 262144
              captured += size
              assert captured <= 262144
              print(f'Actual {capture.name}:')
              if size:
                  print(capture.read_text(), end='')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"Native provider build verdict: {result['result']}\n\n")
              stream.write('Actual PE32/SDK ABI/linked instruction build proof only; Windows loading, credentials, TLS1.3, Kernel64 forwarding, applications and final ISO remain unverified.\n')
          PYTHON

      - name: Seal the explicit source and PE32 handoff
        id: native_handoff_seal
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.retain_native_handoff }}
        timeout-minutes: 3
        run: |
          python3 -B - "$PMA_PROVIDER_PE32_PROOF" "$GITHUB_SHA" <<'PYTHON'
          import hashlib, os, stat, sys
          from pathlib import Path
          path = Path.cwd() / 'ntwin32/legacy_provider_bridge/seal_native_handoff_6970.py'
          expected = '728535d641874a9b30182cf77b68bd39a207615ae8b12282f9f9b98e4a192c07'
          identity = lambda item: (item.st_dev, item.st_ino, item.st_mode, item.st_uid,
                                   item.st_gid, item.st_nlink, item.st_size, item.st_mtime_ns, item.st_ctime_ns)
          with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as source:
              initial = os.fstat(source.fileno())
              assert stat.S_ISREG(initial.st_mode) and initial.st_nlink == 1 and initial.st_size <= 65536
              raw = source.read(65537)
              assert hashlib.sha256(raw).hexdigest() == expected
              sys.argv = [str(path), '--proof-root', sys.argv[1], '--expected-head', sys.argv[2],
                          '--retain', '--include-sources']
              try:
                  exec(compile(raw, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
              finally:
                  source.seek(0)
                  final = os.fstat(source.fileno())
                  assert identity(initial) == identity(final) == identity(path.stat(follow_symlinks=False))
                  assert hashlib.sha256(source.read(65537)).hexdigest() == expected
          PYTHON
          python3 -B - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          root = Path.cwd()
          reserve, budget = 20 * 1024**3, 64 * 1024**2
          free = shutil.disk_usage(root).free
          assert free >= reserve + budget
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'upload_free_before={free}\n')
          print(json.dumps({'schema': 'native-handoff-upload-observation-v1', 'phase': 'before-upload',
                            'available_bytes': free, 'reserve_bytes': reserve,
                            'observed_growth_limit_bytes': budget, 'filesystem_quota_verified': False,
                            'all_transient_peaks_observed': False}, sort_keys=True))
          PYTHON

      - name: Retain only the sealed explicit handoff files
        id: native_handoff_upload
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.retain_native_handoff && steps.native_handoff_seal.outputs.handoff_result == 'PASS_HANDOFF_ENVELOPE_ONLY' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-provider-pe32-6970-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native_handoff_seal.outputs.handoff_paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Revalidate the retained handoff and record observed upload scope
        if: ${{ always() && steps.native_handoff_seal.outcome == 'success' && steps.native_handoff_upload.outcome == 'success' }}
        timeout-minutes: 3
        env:
          PMA_HANDOFF_MANIFEST_SHA256: ${{ steps.native_handoff_seal.outputs.handoff_manifest_sha256 }}
          PMA_HANDOFF_UPLOAD_FREE_BEFORE: ${{ steps.native_handoff_seal.outputs.upload_free_before }}
          PMA_HANDOFF_ARTIFACT_ID: ${{ steps.native_handoff_upload.outputs.artifact-id }}
          PMA_HANDOFF_ARTIFACT_URL: ${{ steps.native_handoff_upload.outputs.artifact-url }}
          PMA_HANDOFF_ARTIFACT_SHA256: ${{ steps.native_handoff_upload.outputs.artifact-digest }}
        run: |
          python3 -B - "$PMA_PROVIDER_PE32_PROOF" "$GITHUB_SHA" "$PMA_HANDOFF_MANIFEST_SHA256" <<'PYTHON'
          import hashlib, os, stat, sys
          from pathlib import Path
          path = Path.cwd() / 'ntwin32/legacy_provider_bridge/seal_native_handoff_6970.py'
          expected = '728535d641874a9b30182cf77b68bd39a207615ae8b12282f9f9b98e4a192c07'
          identity = lambda item: (item.st_dev, item.st_ino, item.st_mode, item.st_uid,
                                   item.st_gid, item.st_nlink, item.st_size, item.st_mtime_ns, item.st_ctime_ns)
          with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as source:
              initial = os.fstat(source.fileno())
              assert stat.S_ISREG(initial.st_mode) and initial.st_nlink == 1 and initial.st_size <= 65536
              raw = source.read(65537)
              assert hashlib.sha256(raw).hexdigest() == expected
              sys.argv = [str(path), '--proof-root', sys.argv[1], '--expected-head', sys.argv[2],
                          '--verify-existing', '--expected-manifest-sha256', sys.argv[3], '--include-sources']
              try:
                  exec(compile(raw, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
              finally:
                  source.seek(0)
                  final = os.fstat(source.fileno())
                  assert identity(initial) == identity(final) == identity(path.stat(follow_symlinks=False))
                  assert hashlib.sha256(source.read(65537)).hexdigest() == expected
          PYTHON
          python3 -B - <<'PYTHON'
          import hashlib, json, os, re, shutil, stat
          from pathlib import Path
          root = Path.cwd()
          before = int(os.environ['PMA_HANDOFF_UPLOAD_FREE_BEFORE'])
          free = shutil.disk_usage(root).free
          reserve, budget = 20 * 1024**3, 64 * 1024**2
          assert free >= reserve and max(0, before-free) <= budget
          artifact_id = os.environ['PMA_HANDOFF_ARTIFACT_ID']
          digest = os.environ['PMA_HANDOFF_ARTIFACT_SHA256']
          assert re.fullmatch(r'[1-9][0-9]*', artifact_id)
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          expected_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts/{artifact_id}"
          assert os.environ['PMA_HANDOFF_ARTIFACT_URL'] == expected_url
          manifest = Path(os.environ['PMA_PROVIDER_PE32_PROOF']) / 'native-handoff-6970.json'
          identity = lambda item: (item.st_dev, item.st_ino, item.st_mode, item.st_uid,
                                   item.st_gid, item.st_nlink, item.st_size, item.st_mtime_ns, item.st_ctime_ns)
          with os.fdopen(os.open(manifest, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as stream:
              info = os.fstat(stream.fileno())
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 16384
              assert identity(info) == identity(manifest.stat(follow_symlinks=False))
              raw = stream.read(16385)
              assert len(raw) <= 16384
              assert identity(info) == identity(os.fstat(stream.fileno())) == identity(manifest.stat(follow_symlinks=False))
          assert hashlib.sha256(raw).hexdigest() == os.environ['PMA_HANDOFF_MANIFEST_SHA256']
          print('Handoff manifest SHA256:', hashlib.sha256(raw).hexdigest())
          print(raw.decode('utf-8'), end='')
          observation = {'schema': 'native-handoff-upload-observation-v1', 'phase': 'after-upload',
                         'head': os.environ['GITHUB_SHA'], 'artifact_id': artifact_id,
                         'artifact_url': expected_url, 'artifact_sha256': digest,
                         'available_before_bytes': before, 'available_after_bytes': free,
                         'observed_net_growth_bytes': max(0, before-free),
                         'reserve_bytes': reserve, 'observed_growth_limit_bytes': budget,
                         'closed_build_receipt_rewritten': False,
                         'filesystem_quota_verified': False, 'continuous_minimum_free_verified': False,
                         'all_transient_peaks_observed': False, 'upload_action_lifetime_verified': False,
                         'consumer_archive_verification_required': True,
                         'native_execution_verified': False, 'windows98_integration_verified': False}
          print(json.dumps(observation, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f'Explicit source/PE32 handoff artifact: {expected_url}\n\n')
              stream.write('Post-upload envelope verified; recipient archive/inner-byte verification and actual Windows98 loading remain required. Upload storage checks are boundary observations only.\n')
          PYTHON
