# SPDX-License-Identifier: GPL-2.0-only
# Fresh own-header IPC receive proof and an ELF32 object; no guest or artifacts.
name: Kernel32 IPC receive own closure host proof

'on':
  push:
    branches: [codex/theme-integration-6970]
    paths:
      - .github/workflows/k32-ipc-guarded-6970.yml
      - shizukudos/kernel32/ipc.c
      - shizukudos/kernel32/k32.h
      - shizukudos/kernel32/tests/test_ipc_host.c
      - shizukudos/kcommon/khc.h
      - shizukudos/abi/shz_abi.h
      - shizukudos/abi/shz_ipc.h
      - shizukudos/tests/test_k32_ipc.py
      - shizukudos/tests/test_k32_ipc_guarded_6970.py
      - ntwin32/legacy_provider_bridge/test_native_sspi_6970.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k32-ipc-guarded-6970-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-ipc-receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Bind the actual checkout to a fresh proof directory
        run: |
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import os, re, subprocess
          root = Path.cwd().resolve()
          expected = os.environ['GITHUB_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', expected) and actual == expected
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          assert run_id.isdigit() and attempt.isdigit()
          proof = root / 'build/k32-ipc-guarded-6970' / f'actions-{run_id}-{attempt}'
          assert not proof.exists()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PMA_K32_IPC_PROOF={proof}\n')
          print(f'Exact checkout {actual}; fresh own-closure proof {proof}')
          PYTHON

      - name: Exercise actual IPC code and compile its freestanding i486 object
        run: |
          python3 -B shizukudos/tests/test_k32_ipc_guarded_6970.py --output-root "$PMA_K32_IPC_PROOF"

      - name: Record the bounded receipt without uploading binaries
        if: always()
        run: |
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os, stat
          root = Path.cwd().resolve()
          value = os.environ.get('PMA_K32_IPC_PROOF')
          if not value:
              print('Proof setup did not finish; no result adopted.')
              raise SystemExit(0)
          proof = Path(value)
          assert proof.parent == root / 'build/k32-ipc-guarded-6970'
          path = proof / 'result.json'
          if not path.exists():
              print('No receipt; no compile or assertion result adopted.')
              raise SystemExit(0)
          assert not path.is_symlink()
          info = path.stat()
          assert stat.S_ISREG(info.st_mode) and info.st_size <= 262144
          data = path.read_bytes()
          result = json.loads(data)
          print('Receipt SHA256:', hashlib.sha256(data).hexdigest())
          print(data.decode(), end='')
          incomplete_failure = (
              result.get('result') == 'FAIL'
              and result.get('receipt_accounting_verified') is False
              and result.get('schema') == 'k32-ipc-guarded-host-invalid-receipt-v1'
              and isinstance(result.get('error'), str)
          )
          if incomplete_failure:
              print('Incomplete failure receipt; no successful result adopted.')
          else:
              for key in (
                  'native_execution_verified', 'windows98_integration_verified',
                  'vmm_execution_verified', 'context_switch_execution_verified',
                  'deadline_scheduler_execution_verified', 'cross_domain_execution_verified',
                  'peer_integration_verified',
              ):
                  assert result[key] is False
          captured = 0
          for kind in ('host', 'sanitizer'):
              for case in ('head', 'magic', 'slots', 'size', 'malformed', 'refill', 'normal'):
                  for suffix in ('stdout', 'stderr'):
                      name = f'{kind}-{case}.{suffix}'
                      capture = proof / name
                      if capture.exists():
                          assert not capture.is_symlink()
                          info = capture.stat()
                          assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1
                          captured += info.st_size
                          assert captured <= 262144
                          print(f'Actual {name}:')
                          print(capture.read_text(), end='')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"Production IPC receive verdict: {result['result']}\n\n")
              stream.write('Host hypercall/scheduler boundaries and a compile-only ELF32 object; Windows98/VMM, scheduling deadlines and actual cross-domain execution remain unverified.\n')
          PYTHON
