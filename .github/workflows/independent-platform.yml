# SPDX-License-Identifier: GPL-2.0-only
# Host contracts and standalone QEMU evidence; no Windows media or publication.
name: Independent platform host validation

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: independent-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host:
    name: Host contracts and original i486/PE32 builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      NTW_SANITIZER_CC: clang
      NTWU_CC: clang
    steps:
      - name: Check out the tested revision without retaining credentials
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install host and cross-compilation tools
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            gcc-multilib clang lld mingw-w64 nasm make binutils python3 python3-pil fonts-dejavu-core qemu-utils

      - name: Test Chromium and Electron result evidence on the host
        # Fixture and subprocess tests only; no guest or application run is claimed.
        run: |
          python3 -m unittest discover -s shizukudos/tests -p 'test_k64_*runner.py' -v
          python3 shizukudos/tests/test_qemu_bounded.py -v

      - name: Build NTWrapper9x and NTWin32Wrapper9x
        run: python3 platform/build.py

      - name: Test kernel, Win32, UTF, and package evidence contracts
        # platform/test.py includes the exhaustive Unicode scalar/oracle suite.
        timeout-minutes: 4
        run: python3 platform/test.py

      - name: Execute actual PE32 code with host service mocks
        # Static Linux ELF32 executes original DLL instructions; this is not Windows.
        run: python3 platform/abi32/build.py

      - name: Preserve native runner failures and complete output writes
        # Compiler fault models and an actual i486 PE32/import audit; no guest.
        run: python3 ntwin32/win64/tests/test_runner_result.py --out build/ntw64run-ci

      - name: Build and test the original LE VxD bridge
        run: |
          python3 ntwrapper/vxd/build.py
          python3 ntwrapper/vxd/test.py

      - name: Test graphics and verify freestanding objects
        run: |
          make -C ntwddm test freestanding freestanding32
          make -C ntwddm sanitize CC=clang

      - name: Test original freestanding compiler memory support
        run: python3 platform/freestanding/test.py

      - name: Build the native GDI probe and test its software adapter
        # Build/import audit and host pixel model only; no native GDI execution.
        run: |
          python3 ntwddm/win98/test.py
          python3 ntwddm/win98/build.py

      - name: Test PCI configuration and verify the freestanding i486 object
        # Clang may lower aggregate initialization to memset even with
        # -ffreestanding. Resolve it with original project compiler support.
        run: |
          make -C drivers/pcie test
          make -C drivers/pcie sanitize CC=clang
          clang --target=i486-none-elf -std=c11 -O2 \
            -Wall -Wextra -Werror -Wpedantic -Wconversion -Wshadow \
            -ffreestanding -fno-builtin -fno-stack-protector \
            -Idrivers/pcie/include -c drivers/pcie/src/ntw_pcie.c \
            -o drivers/pcie/build/ntw-pcie-core-i486.o
          clang --target=i486-none-elf -std=c11 -O2 \
            -Wall -Wextra -Werror -Wpedantic -Wconversion -Wshadow \
            -ffreestanding -fno-builtin -fno-stack-protector \
            -march=i486 -mno-sse -mno-sse2 -mno-mmx -msoft-float \
            -fno-pie -fno-pic -c platform/freestanding/memory.c \
            -o drivers/pcie/build/ntw-memory-i486.o
          ld -m elf_i386 -r drivers/pcie/build/ntw-pcie-core-i486.o \
            drivers/pcie/build/ntw-memory-i486.o \
            -o drivers/pcie/build/ntw-pcie-i486.o
          nm -u drivers/pcie/build/ntw-pcie-i486.o | tee drivers/pcie/build/undefined-symbols-i486.txt
          test ! -s drivers/pcie/build/undefined-symbols-i486.txt

      - name: Build x64 UEFI and test firmware contracts on the host
        run: |
          python3 shizukudos/uefi/build.py
          python3 shizukudos/uefi/test.py
          python3 shizukudos/uefi/test.py --cc clang --sanitize

      - name: Build the 32-bit transition and test layout and paging contracts
        run: |
          python3 shizukudos/uefi32/build.py
          python3 shizukudos/uefi32/test.py

      - name: Test AHCI models and build its standalone integration
        run: |
          python3 drivers/ahci_native/test.py
          python3 shizukudos/uefi_ahci/build.py
          python3 shizukudos/uefi_ahci/test.py

      - name: Test the original FAT32 reader against synthetic sectors
        # Host models and freestanding objects only; no Windows media or guest.
        run: python3 drivers/fat_native/test.py

      - name: Build FAT32-AHCI firmware integration and test its evidence contracts
        # Synthetic files and host callback models; test_qemu.py is not run.
        run: |
          python3 shizukudos/uefi_fat/build.py
          python3 shizukudos/uefi_fat/test.py

      - name: Test installation-lab storage guards without starting a guest
        timeout-minutes: 3
        run: |
          python3 platform/win98lab/test_storage.py -v
          python3 platform/win98lab/test_packed.py -v
          python3 platform/win98lab/test_lab_packed.py -v
          python3 platform/win98lab/test_base_archive.py -v
          python3 platform/win98lab/test_lab_base_archive.py -v
          python3 platform/win98lab/test_trial.py -v
          python3 platform/win98lab/test_lab_trial.py -v

      - name: Build and host-test the original native probe supervisor
        # Fake WinAPI fault models and PE import audit only; no Windows execution.
        run: |
          python3 platform/win98lab/test_native_runner.py
          python3 platform/win98lab/test_native_runner.py --diagnostic
          python3 platform/win98lab/test_native_logs.py

      - name: Test and build the bounded Chromium launch observer
        # Synthetic WinAPI models and PE imports only; no browser or guest run.
        run: |
          python3 platform/win98lab/app_probe/test.py
          python3 platform/win98lab/app_probe/test.py --cd-source

      - name: Test the ReactOS-reference exception core
        # Portable lifetime/concurrency models only; no Win98 exception hook.
        run: python3 ntwin32/exception/test.py

      - name: Test xHCI command rings and build the PCI-E integration
        run: |
          python3 drivers/xhci_native/test.py
          python3 shizukudos/uefi_xhci/build.py
          python3 shizukudos/uefi_xhci/test.py

      - name: Test original USB descriptor validation and freestanding builds
        # Bounded parsing only; no controller, USB device, or class-driver I/O.
        run: python3 drivers/usb_native/test.py

      - name: Test USB device and configuration transport and build firmware integrations
        # Asynchronous host model and hostile-evidence tests; no guest launch.
        run: |
          python3 drivers/xhci_usb/test.py
          python3 shizukudos/uefi_usb/build.py
          python3 shizukudos/uefi_usb/test.py
          python3 shizukudos/uefi_usb_config/build.py
          python3 shizukudos/uefi_usb_config/test.py

      - name: Record validation scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This workflow checks project host contracts, sanitizer results,
          freestanding builds, and PE32 execution with explicit service mocks.
          Individual step outcomes determine whether those checks passed.

          It does not run a Windows guest, execute real VMM calls, test physical
          drivers, boot firmware, use OS installation media, or publish packages.
          Native Windows compatibility requires separate guest evidence.
          SUMMARY

  original-userland-host:
    name: Original userland source observation with synthetic FAT and real file descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the tested revision without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Test the actual original observation producer and cleanup failures
        # Fake nonexecutable contents in a sparse 2GiB FAT disk; no Windows or VM.
        run: |
          mkdir -p build/original-userland-ci
          python3 tools/tests/test_native_original_userland.py -v 2>&1 | tee build/original-userland-ci/producer.log

      - name: Test phase admission and retained-FD re-observation
        # Includes the production guardian's actual source-admitted FAT observer.
        run: |
          python3 shizukudos/supervisor/native_win98/tests/test_original_disk_lineage.py -v 2>&1 | tee build/original-userland-ci/guardian.log

      - name: Keep synthetic observation test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: original-userland-host-evidence
          path: build/original-userland-ci/
          if-no-files-found: warn

  shizukudos10-tcg:
    name: ShizukuDOS 10 standalone kernels and Win64 apps under QEMU TCG
    # Host evidence only: QEMU software CPU, no KVM, no VMX (the Supervisor path stays unverified here).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the tested revision without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install cross-compilers, QEMU and image tools
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            gcc gcc-multilib clang libclang-rt-18-dev mingw-w64 nasm make binutils python3 python3-pil \
            qemu-system-x86 ovmf mtools dosfstools xorriso \
            python3-pefile lld llvm flex bison
          # python3-pefile: independent PE reader for test_pe_real.py; lld: lld-link for the MSVC-ABI C++ tests
          # (tests/t_*.cpp) and test_pe_real's fixtures; llvm: llvm-dlltool (test_pe_real); flex/bison: Wine's host
          # configure (widl/wrc) for the Wine DLL ports

      - name: Host models (PE32+ parser, inter-kernel ABI)
        run: |
          python3 shizukudos/win64/tests/test_pe_parse.py
          python3 shizukudos/abi/test_abi.py
          python3 shizukudos/win64/tests/test_wer_sdk_host.py

      - name: Build Kernel32, Kernel64 (Supervisor + standalone) and the Win64 runtime
        run: |
          python3 shizukudos/win64/build.py
          python3 shizukudos/kbuild.py

      - name: Boot Kernel32 standalone (QEMU TCG) and check its guest evidence
        timeout-minutes: 6
        run: python3 shizukudos/tests/run_k32_standalone.py --accel tcg

      - name: Boot Kernel64 standalone under QEMU TCG with self-tests and every T_*.EXE Win64 app
        timeout-minutes: 15
        run: python3 shizukudos/tests/run_k64_standalone.py --accel tcg --timeout 600

      - name: NT driver host under QEMU TCG (load unmodified .sys, IRP/DPC/timer/PCI + user reachability)
        timeout-minutes: 15
        run: python3 shizukudos/tests/run_k64_ntdrv.py --accel tcg --timeout 600

      - name: Measure driver import coverage against the provider export tables
        run: python3 shizukudos/win64/tools/import_coverage.py build/shizukudos/win64/ntdrv --ntoskrnl build/shizukudos/win64/ntdrv

      - name: Host suite (DOS16 reproducibility, upstream pins)
        # Fetches the pinned FreeDOS trees and the Open Watcom snapshot (network).
        timeout-minutes: 20
        run: python3 shizukudos/tools/shz.py test --suite host

      - name: Keep the guest serial logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shizukudos10-tcg-evidence
          path: |
            build/shizukudos/kernel64s/run/
            build/shizukudos/kernel64s/ntdrv-run/
            build/shizukudos/kernel32s/run/
            build/shizukudos/results/
          if-no-files-found: warn
