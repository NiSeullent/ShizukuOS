      - name: Retain exact project source and actual compiler proof
        id: retained
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-tls-sspi-6970-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.handoff.outputs.paths }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

      - name: Observe separate upload boundary
        if: ${{ success() }}
        run: |
          python3 -B - <<'PYTHON'
          import json,os,shutil
          from pathlib import Path
          before=int(os.environ['PMA_NATIVE_TLS_UPLOAD_FREE']);after=shutil.disk_usage(Path.cwd()).free
          growth=max(0,before-after)
          assert after>=20*1024**3 and growth<=64*1024**2
          print(json.dumps({'upload_observed_before_free':before,'upload_observed_after_free':after,'net_observed_growth':growth,'observed_growth_budget':64*1024**2,'continuous_floor_verified':False,'transient_peak_verified':False,'quota_verified':False,'cleanup_credit':0,'native_execution_verified':False}))
          PYTHON
