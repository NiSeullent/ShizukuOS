# SPDX-License-Identifier: GPL-2.0-only
name: Current native TLS and SSPI guarded build

'on':
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-tls-build-6970-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-tls-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Prepare bounded tools on the isolated hosted runner
        timeout-minutes: 5
        run: |
          python3 -B - <<'PYTHON'
          import os, shutil, stat
          from pathlib import Path
          root = Path.cwd().resolve()
          assert shutil.disk_usage(root).free >= 20 * 1024**3 + 1024**3
          # The ordinary runner retains writable namespace parents. Sudo may
          # create only its private preparation child, never the shared build parent.
          for parent in (root / 'build', root / 'build/native-tls-prep-6970',
                         root / 'build/native-tls-proof-6970'):
              for component in (parent, *parent.parents):
                  assert not component.is_symlink()
              parent.mkdir(mode=0o755, exist_ok=True)
              info = parent.stat(follow_symlinks=False)
              assert stat.S_ISDIR(info.st_mode) and info.st_uid == os.geteuid()
              assert os.access(parent, os.W_OK | os.X_OK)
          assert shutil.disk_usage(root).free >= 20 * 1024**3 + 1024**3
          print('Runner-owned writable namespace parents prepared; no compiler or probe executed.')
          PYTHON
          sudo -n python3 -B - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(id -u)" "$(id -g)" <<'PYTHON'
          import hashlib, json, os, resource, selectors, shutil, signal, stat
          import subprocess, sys, time
          from pathlib import Path
          root = Path.cwd().resolve()
          run_id, attempt, runner_uid, runner_gid = sys.argv[1:]
          assert run_id.isdigit() and attempt.isdigit() and os.geteuid() == 0
          reserve, budget = 20 * 1024**3, 1024**3
          initial = shutil.disk_usage(root).free
          assert initial >= reserve + budget
          prep = root / 'build/native-tls-prep-6970' / f'actions-{run_id}-{attempt}'
          assert not prep.exists() and not prep.is_symlink()
          for component in (prep, *prep.parents):
              assert not component.is_symlink()
          prep.mkdir(parents=True, mode=0o755)
          assert runner_uid.isdigit() and runner_gid.isdigit()
          os.chown(prep, int(runner_uid), int(runner_gid))
          tmp, archives, pydeps = (prep / name for name in ('tmp', 'archives', 'pydeps'))
          tmp.mkdir(mode=0o755)
          archives.mkdir(mode=0o755)
          minimum, captured, records = initial, 0, []
          environment = os.environ.copy()
          environment.update(TMPDIR=str(tmp), TMP=str(tmp), TEMP=str(tmp),
                             PYTHONDONTWRITEBYTECODE='1', PIP_DISABLE_PIP_VERSION_CHECK='1',
                             DEBIAN_FRONTEND='noninteractive')

          def observe(pending=0):
              global minimum
              free = shutil.disk_usage(root).free
              minimum = min(minimum, free)
              if free < reserve + pending or initial - free + pending > budget:
                  raise RuntimeError('Hosted prerequisite reserve or observed 1 GiB change budget crossed')
              return free

          def child_limits():
              resource.setrlimit(resource.RLIMIT_FSIZE, (budget, budget))
              resource.setrlimit(resource.RLIMIT_CORE, (0, 0))

          def run(label, argv):
              global captured
              observe()
              print('Hosted-only prerequisite:', label, argv, flush=True)
              watch = None
              output, started = bytearray(), time.monotonic()
              aborted = None
              group_kill = 'NOT_REQUESTED'
              child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT, env=environment,
                                       start_new_session=True, preexec_fn=child_limits)
              try:
                  # Protect selector creation/registration immediately after
                  # successful spawn, including failures before the first read.
                  watch = selectors.DefaultSelector()
                  watch.register(child.stdout, selectors.EVENT_READ)
                  while True:
                      observe()
                      if time.monotonic() - started > 120:
                          raise RuntimeError('Hosted prerequisite command exceeded 120 seconds')
                      status = os.waitid(os.P_PID, child.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                      if status and status.si_pid == child.pid and not watch.get_map():
                          break
                      for key, _ in watch.select(0.05):
                          block = os.read(key.fileobj.fileno(), 16384)
                          if not block:
                              watch.unregister(key.fileobj)
                          else:
                              remaining = 262144 - captured
                              output.extend(block[:remaining])
                              captured += min(len(block), remaining)
                              if len(block) > remaining:
                                  raise RuntimeError('Hosted prerequisite aggregate log exceeded 256 KiB')
                  # Retain the WNOWAIT leader token while terminating any
                  # silent descendants from this preparation launch only.
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                      group_kill = 'SIGKILL_SENT_TO_OWNED_GROUP_BEFORE_REAP'
                  except ProcessLookupError:
                      group_kill = 'OWNED_GROUP_ALREADY_ABSENT_BEFORE_REAP'
                  child.wait(timeout=5)
              except BaseException as error:
                  aborted = str(error)[:2048]
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                      group_kill = 'SIGKILL_SENT_TO_OWNED_GROUP_BEFORE_REAP'
                  except ProcessLookupError:
                      group_kill = 'OWNED_GROUP_ALREADY_ABSENT_BEFORE_REAP'
                  child.wait(timeout=5)
                  raise
              finally:
                  try:
                      if watch is not None:
                          watch.close()
                  finally:
                      child.stdout.close()
                  print(output.decode('utf-8', errors='replace'), end='')
                  records.append({'label': label, 'argv': argv, 'exit_code': child.returncode,
                                  'direct_child_reaped': child.returncode is not None,
                                  'aborted': aborted, 'log_bytes': len(output),
                                  'owned_group_kill_before_reap': group_kill,
                                  'whole_process_group_reaped_verified': False,
                                  'log_sha256': hashlib.sha256(output).hexdigest(),
                                  'elapsed_seconds': time.monotonic() - started})
              assert child.returncode == 0
              observe()

          result, error = 'FAIL', None
          try:
              # No update, upgrade, removal or cache cleanup is performed.
              run('i686-win32-toolchain', [
                  'apt-get', '-o', 'Acquire::Retries=0', '-o', 'DPkg::Lock::Timeout=10',
                  '-o', 'Dir::Cache::archives=' + str(archives),
                  '--no-install-recommends', '--no-upgrade', '--no-remove', '--yes',
                  'install', 'gcc-mingw-w64-i686-win32', 'cmake', 'ninja-build', 'binutils',
              ])
              run('isolated-pe-parser', [sys.executable, '-B', '-m', 'pip', 'install',
                  '--disable-pip-version-check', '--no-compile', '--no-cache-dir',
                  '--target', str(pydeps), 'pefile==2024.8.26'])
              run('actual-installed-package-versions', [
                  'dpkg-query', '-W', '-f=${Package}\t${Version}\n',
                  'gcc-mingw-w64-i686-win32', 'gcc-mingw-w64-i686-win32-runtime',
                  'binutils-mingw-w64-i686', 'mingw-w64-i686-dev', 'mingw-w64-common',
                  'binutils', 'binutils-x86-64-linux-gnu', 'binutils-common', 'cmake', 'ninja-build',
              ])
              assert shutil.which('i686-w64-mingw32-gcc-win32')
              assert shutil.which('i686-w64-mingw32-objdump')
              assert shutil.which('as') and shutil.which('ld')
              assert (pydeps / 'pefile.py').is_file()
              observe()
              assert shutil.disk_usage(root).free >= reserve + 32 * 1024**2
              result = 'PASS_HOSTED_PREREQUISITES_ONLY'
          except BaseException as failure:
              error = str(failure)[:2048]
              raise
          finally:
              # This receipt describes observed disk changes, not a quota or full transient peak.
              destination = prep / 'result.json'
              closure_failure = None

              def receipt_bytes():
                  receipt = {'schema': 'native-tls-hosted-preparation-v1', 'result': result,
                             'error': error, 'reserve_bytes': reserve,
                             'observed_disk_change_budget_bytes': budget,
                             'available_before_bytes': initial,
                             'minimum_observed_free_bytes': minimum,
                             'observed_consumption_upper_sample_bytes': max(0, initial-minimum),
                             'commands': records, 'aggregate_log_bytes': captured,
                             'native_execution_verified': False, 'windows98_integration_verified': False,
                             'filesystem_quota_enforced': False, 'all_transient_peaks_measured': False}
                  encoded = (json.dumps(receipt, indent=2) + '\n').encode()
                  assert len(encoded) <= 65536
                  return encoded

              for closing_attempt in range(4):
                  if result != 'FAIL':
                      try:
                          observe(pending=65536)
                      except BaseException as failure:
                          result, error = 'FAIL', str(failure)[:2048]
                          closure_failure = failure
                  data = receipt_bytes()
                  with destination.open('xb' if closing_attempt == 0 else 'wb') as stream:
                      stream.write(data)
                  if result == 'FAIL':
                      break
                  recorded_minimum = minimum
                  try:
                      observe()
                  except BaseException as failure:
                      result, error = 'FAIL', str(failure)[:2048]
                      closure_failure = failure
                      # Replace our unfrozen candidate with bounded FAIL evidence.
                      data = receipt_bytes()
                      with destination.open('wb') as stream:
                          stream.write(data)
                      break
                  if minimum == recorded_minimum:
                      break
              else:
                  result, error = 'FAIL', 'Hosted preparation receipt minimum did not stabilize'
                  closure_failure = RuntimeError(error)
                  data = receipt_bytes()
                  with destination.open('wb') as stream:
                      stream.write(data)
              print('Preparation receipt SHA256:', hashlib.sha256(data).hexdigest())
              print(data.decode(), end='')
              if closure_failure is not None:
                  raise closure_failure
          PYTHON


      - name: Bind revision and isolated paths
        run: |
          python3 -B - <<'PYTHON'
          import os,re,subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          expected=os.environ['GITHUB_SHA']
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}',expected) and actual==expected
          run_id,attempt=os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT']
          assert run_id.isdigit() and attempt.isdigit()
          prep=root/'build/native-tls-prep-6970'/f'actions-{run_id}-{attempt}'
          proof=root/'build/native-tls-proof-6970'/f'actions-{run_id}-{attempt}'
          assert not proof.exists() and (prep/'pydeps/pefile.py').is_file()
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write(f'PMA_NATIVE_TLS_PREP={prep}\nPMA_NATIVE_TLS_PROOF={proof}\nPYTHONPATH={prep / "pydeps"}\n')
          print('Exact source:',actual,'; fresh proof:',proof)
          PYTHON

      - name: Prepare pinned original upstream then build four native artifacts
        run: |
          python3 -B - <<'PYTHON'
          import hashlib,os,stat,sys,types
          from pathlib import Path
          root=Path.cwd().resolve()
          pins={'ntwin32/secure_transport/build_native_tls_guarded_6970.py': 'bf1efcebed90d9a2524836a0e237b1923b2250d8f8d62fcc5b6949b5b048f16d', 'ntwin32/secure_transport/i486_stream_6970.py': '0b661068ebac98331aac796d4612ee6ef78f3825b12683df9ec03e46f8e3a08f', 'ntwin32/secure_transport/native_tls_resources_6970.py': 'deeb26aa23d5724cad73be48ab20f7cf8b348eaa2bb32c13dfbc81657e8af0eb', 'ntwin32/secure_transport/native_tls_quiescent_controls_6970.py': 'ed73af0b390655953aa63b26c6ee5be3ba5b1779c788d2e147761758a428949d', 'ntwin32/secure_transport/native_tls_pidfd_controls_6970.py': '46149184b734e221f267eed268711dbd94c754ee102256276cdd2cafe6a58071', 'ntwin32/secure_transport/native_tls_stale_order_controls_6970.py': '36282f2bdabf25c7cd970e426de1c3a835346c000888cc1761c33a952c012aae', 'ntwin32/secure_transport/native_tls_count_epoch_controls_6970.py': '3391ada5ad42a2e10554932a40240b3f8fe4ca9a77e6c0647f7f5c0f5598bc3e'}
          before={}
          identity=lambda s:(s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
          for relative,expected in pins.items():
              path=root/relative
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  info=os.fstat(fd)
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_size<=204800
                  raw=bytearray()
                  while True:
                      part=os.read(fd,65536)
                      if not part:break
                      raw.extend(part)
                      assert len(raw)<=204800
                  assert identity(info)==identity(os.fstat(fd))==identity(path.lstat())
                  assert hashlib.sha256(raw).hexdigest()==expected
                  before[relative]=(identity(info),bytes(raw))
              finally:os.close(fd)
          path=root/'ntwin32/secure_transport/build_native_tls_guarded_6970.py'
          module=types.ModuleType('current_native_tls_bound_source');module.__file__=str(path)
          exec(compile(before[str(path.relative_to(root))][1],str(path),'exec'),module.__dict__)
          prep,proof=Path(os.environ['PMA_NATIVE_TLS_PREP']),Path(os.environ['PMA_NATIVE_TLS_PROOF'])
          actual_prepared=module.prepare(prep)
          module.build(proof,prep,actual_prepared['sha256'])
          for relative,(info,raw) in before.items():
              assert identity((root/relative).lstat())==info and (root/relative).read_bytes()==raw
          PYTHON

      - name: Record actual bounded receipt and captures
        if: always()
        run: |
          python3 -B - <<'PYTHON'
          import hashlib,json,os,stat
          from pathlib import Path
          value=os.environ.get('PMA_NATIVE_TLS_PROOF')
          if not value:
              print('Preparation did not reach the build. No PASS adopted.')
              raise SystemExit(0)
          proof=Path(value);path=proof/'result.json'
          if not path.exists():
              print('No counted build receipt. No PASS adopted.')
              raise SystemExit(0)
          identity=lambda s:(s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
          def read(path,maximum,expected=None):
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  info=os.fstat(fd)
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_size<=maximum
                  raw=bytearray()
                  while True:
                      part=os.read(fd,65536)
                      if not part:break
                      raw.extend(part);assert len(raw)<=maximum
                  assert identity(info)==identity(os.fstat(fd))==identity(path.lstat())
                  if expected is not None:
                      assert {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'identity':list(identity(info))}==expected
                  return bytes(raw)
              finally:os.close(fd)
          raw=read(path,1048576);receipt=json.loads(raw)
          print('Current TLS actual receipt SHA256:',hashlib.sha256(raw).hexdigest())
          print(raw.decode(),end='')
          captured=0
          for p in sorted([*proof.glob('*.stdout'),*proof.glob('*.stderr')]):
              data=read(p,262144);captured+=len(data);assert captured<=262144
              print('Actual capture:',p.name)
              print(data.decode('utf-8',errors='replace'),end='')
          retained_control_text=0
          for key,title in (('quiescent_controls','quiescent'),('pidfd_controls','pidfd'),('stale_order_controls','stale-order'),('count_epoch_controls','count-epoch')):
              group=receipt.get(key,{})
              fixture=group.get('fixture_build',{}) if key=='pidfd_controls' else {}
              fixture_text={fixture[name]['path'] for name in ('source','map') if name in fixture}
              if key=='pidfd_controls':
                  allowed={proof/'tmp'/('pidfd-%02d'%index)/name for index in range(5) for name in ('result.json','control.stdout','control.stderr')}
                  allowed.update((proof/'tmp/pidfd-fixture.S',proof/'tmp/pidfd-fixture.map'))
                  assert fixture_text<=set(map(str,allowed))
              elif key=='stale_order_controls':
                  allowed={proof/'tmp'/('stale-order-%02d'%index)/name for index in range(2) for name in ('result.json','control.stdout','control.stderr')}
                  assert not fixture_text
              elif key=='count_epoch_controls':
                  allowed={proof/'tmp'/('count-epoch-%02d'%index)/name for index in range(2) for name in ('result.json','control.stdout','control.stderr')}
                  assert not fixture_text
              else:
                  allowed={proof/'tmp'/('quiescent-%02d'%index)/name for index in range(10) for name in (('result.json','control.stdout','control.stderr') if index<8 else ('result.json',))}
              seen=set()
              for item in group.get('proof_files',[]):
                  p=Path(item['path']);relative=Path(item['relative_path'])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert p==proof/relative and p.is_relative_to(proof/'tmp') and not any(c in str(relative) for c in '\r\n')
                  child_text=p.name in ('result.json','control.stdout','control.stderr')
                  if key in ('pidfd_controls','stale_order_controls','count_epoch_controls'):
                      assert child_text or str(p) in fixture_text
                      assert p.suffix not in ('.o','.ELF')
                  elif not child_text:continue
                  assert p in allowed and p not in seen;seen.add(p)
                  expected={k:item[k] for k in ('bytes','sha256','identity')}
                  data=read(p,524288,expected);retained_control_text+=len(data);assert retained_control_text<=524288
                  print('Actual '+title+' retained file:',str(relative),'bytes='+str(len(data)),'sha256='+hashlib.sha256(data).hexdigest())
                  print(data.decode('utf-8'),end='')
              if group.get('result') in ('PASS_QUIESCENT_GUARD_CONTROLS_ONLY','PASS_PIDFD_VFORK_CONTROLS_ONLY','PASS_STALE_ORDER_CONTROLS_ONLY','PASS_COUNT_EPOCH_CONTROLS_ONLY'):assert seen==allowed
          retained_ninja_text=0
          for name in ('build.ninja','CMakeFiles/rules.ninja'):
              p=proof/'cmake'/name
              expected=receipt.get('configured_generator_inputs',{}).get(str(p))
              if expected is None:continue
              data=read(p,2097152,expected);retained_ninja_text+=len(data);assert retained_ninja_text<=4194304
              print('Actual retained Ninja file:',str(p.relative_to(proof)),'bytes='+str(len(data)),'sha256='+hashlib.sha256(data).hexdigest())
              print(data.decode('utf-8'),end='')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write(f"Current native TLS/SSPI build: {receipt['result']}\n\nActual compile/import/ISA proof only; native Windows, credentials, TLS negotiation, default ROOT, sockets, OS/K64/applications and ISO stay unverified.\n")
          PYTHON

      - name: Verify and seal explicit current project proof paths
        id: handoff
        if: ${{ success() }}
        run: |
          python3 -B - <<'PYTHON'
          import hashlib,json,os,stat,shutil,time
          from pathlib import Path
          root=Path.cwd().resolve();proof=Path(os.environ['PMA_NATIVE_TLS_PROOF']);prep=Path(os.environ['PMA_NATIVE_TLS_PREP'])
          reserve,limit=20*1024**3,32*1024**2
          assert shutil.disk_usage(root).free>=reserve+limit
          identity=lambda s:[s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns]
          def read(path,maximum,system_tool=False):
              assert shutil.disk_usage(root).free>=reserve+limit
              assert path.is_absolute() and path.resolve(strict=True)==path
              for component in (path,*path.parents):
                  info=component.lstat();assert not stat.S_ISLNK(info.st_mode)
                  if system_tool:assert info.st_uid==0 and not info.st_mode&0o022
              if system_tool:assert path.is_relative_to(Path('/usr')) and not path.is_relative_to(proof)
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  info=os.fstat(fd)
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink>=1 and (system_tool or info.st_nlink==1) and info.st_size<=maximum
                  raw=bytearray();started=time.monotonic()
                  while True:
                      part=os.read(fd,65536)
                      if not part:break
                      raw.extend(part);assert len(raw)<=maximum and time.monotonic()-started<=60
                  assert identity(info)==identity(os.fstat(fd))==identity(path.lstat())
                  return bytes(raw),{'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'identity':identity(info)}
              finally:os.close(fd)
          raw,receipt_pin=read(proof/'result.json',1048576);x=json.loads(raw)
          assert x['result']=='PASS_CURRENT_NATIVE_TLS_SSPI_BUILD_ONLY' and x['receipt_accounting_verified'] and x['resource_failure'] is None
          for key in ('native_execution_verified','windows98_integration_verified','credential_execution_verified','network_execution_verified','os_tls_provider_verified','os_registration_verified','kernel64_backend_verified','application_compatibility_verified','default_ROOT_chain_validation_verified','final_ISO_verified','TLS_execution_verified','TLS_negotiation_verified','real_tls_proven_by_this_test','native_guest_proven','native_ROOT_execution_proven'):assert x[key] is False
          selected={proof/'result.json':receipt_pin}
          console=x['Ninja_console_graph'];parser_controls=x['Ninja_console_parser_controls']
          assert x['Ninja_console_graph_before_after_equal'] is True
          assert console['status']=='PASS_LITERAL_SELECTED_EDGES_ONLY'
          assert (console['compile_count'],console['archive_count'],console['PE_count'],console['selected_writer_count'])==(126,6,3,135)
          assert len(console['edges'])==135 and all(row['pool']=='console' for row in console['edges'])
          assert console['manifest_regeneration_edge']['pool']=='console'
          for key in ('configure_or_try_compile_group_containment_verified','escaped_writers_excluded_verified','continuous_group_stop_verified'):assert console[key] is False
          graph_paths={str(proof/'cmake/build.ninja'),str(proof/'cmake/CMakeFiles/rules.ninja')}
          assert set(console['files'])==graph_paths
          for path,pin in console['files'].items():
              path=Path(path);assert read(path,2097152)[1]==pin
              selected[path]=pin
          assert parser_controls['result']=='PASS_PARSER_CONTROLS_ONLY' and parser_controls['completed']==14 and parser_controls['failures']==0
          assert len(parser_controls['cases'])==14 and all(row['result']=='PASS' and row['actual']==row['expected'] for row in parser_controls['cases'])
          assert parser_controls['basis_build_sha256']==console['files'][str(proof/'cmake/build.ninja')]['sha256']
          assert parser_controls['basis_rules_sha256']==console['files'][str(proof/'cmake/CMakeFiles/rules.ninja')]['sha256']
          for key in ('mutated_graphs_written_or_executed','process_execution_verified','native_execution_verified','windows98_integration_verified','tls_execution_verified'):assert parser_controls[key] is False
          controls=x['quiescent_controls']
          assert controls['result']=='PASS_QUIESCENT_GUARD_CONTROLS_ONLY' and controls['completed']==10 and controls['failures']==0
          assert controls['actual_controls_execution_verified'] is True and controls['expected_negative_commands_added_to_parent'] is False
          for key in ('native_execution_verified','windows98_integration_verified','tls_execution_verified','escaped_writers_excluded_verified','continuous_group_stop_verified','filesystem_quota_verified'):assert controls[key] is False
          assert len(controls['proof_files'])<=320
          for item in controls['proof_files']:
              path=Path(item['path']);assert path==proof/item['relative_path'] and path.is_relative_to(proof/'tmp')
              pin={k:v for k,v in item.items() if k not in ('path','relative_path')}
