# SPDX-License-Identifier: GPL-2.0-only
# Actual production URL parsing only; no HTTP/TLS/native-app claim or artifacts.
name: WinHTTP URL component host proof

'on':
  push:
    branches: [codex/theme-integration-6970]
    paths:
      - .github/workflows/winhttp-url-6970.yml
      - shizukudos/tests/test_winhttp_crackurl_6970.c
      - shizukudos/tests/test_winhttp_crackurl_6970.py
      - shizukudos/tests/host/winhttp_url_6970/include/**
      - shizukudos/win64/dlls/winhttp/winhttp.c
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winhttp-url-6970-${{ github.ref }}
  cancel-in-progress: false

jobs:
  url-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Bind unchanged production RED or repaired-source GREEN
        run: |
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root = Path.cwd().resolve()
          expected = os.environ['GITHUB_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', expected) and actual == expected
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          assert run_id.isdigit() and attempt.isdigit()
          production = root / 'shizukudos/win64/dlls/winhttp/winhttp.c'
          old_sha = '0036c09a67593ca10bff5a0cbfbe7d458d9dcc21ea99bd8d69191815a4a7f33b'
          phase = 'red' if hashlib.sha256(production.read_bytes()).hexdigest() == old_sha else 'green'
          proof = root / 'build/winhttp-url-6970' / f'actions-{run_id}-{attempt}-{phase}'
          assert not proof.exists()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PMA_WINHTTP_PHASE={phase}\nPMA_WINHTTP_PROOF={proof}\n')
          print(f'Exact checkout {actual}; phase {phase}; proof {proof}')
          PYTHON

      - name: Execute the actual production translation unit with UTF16 host boundaries
        run: |
          python3 -B shizukudos/tests/test_winhttp_crackurl_6970.py --phase "$PMA_WINHTTP_PHASE" --output-root "$PMA_WINHTTP_PROOF"

      - name: Record the bounded assertion receipt without uploading binaries
        if: always()
        run: |
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os, stat
          root = Path.cwd().resolve()
          value = os.environ.get('PMA_WINHTTP_PROOF')
          if not value:
              print('Proof setup did not finish; no result adopted.')
              raise SystemExit(0)
          proof = Path(value)
          assert proof.parent == root / 'build/winhttp-url-6970'
          path = proof / 'result.json'
          if not path.exists():
              print('No receipt; no compile or assertion result adopted.')
              raise SystemExit(0)
          assert not path.is_symlink()
          info = path.stat()
          assert stat.S_ISREG(info.st_mode) and info.st_size <= 131072
          data = path.read_bytes()
          result = json.loads(data)
          print('Receipt SHA256:', hashlib.sha256(data).hexdigest())
          print(data.decode(), end='')
          incomplete_failure = (
              set(result) == {'result', 'receipt_accounting_verified', 'error'}
              and result['result'] == 'FAIL'
              and result['receipt_accounting_verified'] is False
              and isinstance(result['error'], str)
          )
          if incomplete_failure:
              print('Incomplete failure receipt; no successful result adopted.')
          else:
              assert result['native_execution_verified'] is False
              assert result['windows98_integration_verified'] is False
          for name in ('host-run.stdout', 'host-run.stderr', 'sanitizer-run.stdout', 'sanitizer-run.stderr'):
              capture = proof / name
              if capture.exists():
                  assert not capture.is_symlink() and capture.stat().st_size <= 262144
                  print(f'Actual {name}:')
                  print(capture.read_text(), end='')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"Production WinHttpCrackUrl assertion verdict: {result['result']}\n\n")
              stream.write('URL parsing fixture only; HTTP/TLS/networking, native apps and Windows98 execution remain unverified.\n')
          PYTHON
