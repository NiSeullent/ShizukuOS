# SPDX-License-Identifier: GPL-2.0-only
# Build the one VM install ISO (build/windows98-shizuku-second-edition.iso) and the raw disk image from the checked-out
# commit, boot both through the media matrix (QEMU TCG, SeaBIOS and OVMF), and publish them as a GitHub release.
# Nothing is published unless the matrix verdict is VERIFIED. Download URLs, hashes and how to boot the ISO:
# docs/shizukudos10/RELEASE.md.
name: Release the VM install ISO

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created at the dispatched commit when it does not exist yet; empty = iso-<run number>)
        type: string
        required: false
        default: ''
      prerelease:
        description: Mark the release as a prerelease (releases/latest only follows releases that are not)
        type: boolean
        default: true
  push:
    tags:
      - 'iso-*'
      - 'v*'

# Only the release job can write (contents: write): the build job runs third-party build systems and guest code.
permissions:
  contents: read

concurrency:
  group: release-iso-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and boot-test the ISO and the raw disk
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check out the release commit without retaining credentials
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Resolve the release tag and the prerelease flag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = push ]; then
            # Tag pushes: iso-* and v* with a hyphen (v10.0.0-alpha1, v0.1.9-preview) are prereleases; v* without a
            # hyphen (v10.0.0) is a full release, the kind releases/latest points at.
            tag=$REF_NAME
            case "$tag" in v*-*|iso-*) prerelease=true ;; *) prerelease=false ;; esac
          else
            tag=${INPUT_TAG:-iso-$RUN_NUMBER}
            prerelease=$INPUT_PRERELEASE
          fi
          if ! [[ $tag =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$ ]] || [[ $tag == *..* || $tag == *.lock || $tag == *. ]]; then
            echo "::error::'$tag' is not a usable release tag (letters, digits, . _ + -; at most 100 characters)"
            exit 1
          fi
          case "$prerelease" in true|false) ;; *) echo "::error::prerelease must be true or false"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "release tag $tag, prerelease $prerelease, commit $GITHUB_SHA"

      - name: Install cross-compilers, QEMU, OVMF and image tools
        timeout-minutes: 10
        # The tcg job's list, plus what the media builders call: xxd (CSMWrap/SeaBIOS build), patch (FreeDOS and
        # CSMWrap patches), e2fsprogs (debugfs/e2fsck: install payload and installed-disk checks), file, xz-utils
        # (the published disk image). Syslinux is NOT taken from the runner: the builders fetch the pinned Ubuntu
        # 6.04 .debs (shizukudos/upstream/manifest.json "syslinux", sha256-checked) and unpack them with dpkg-deb.
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            gcc gcc-multilib clang libclang-rt-18-dev mingw-w64 nasm make binutils python3 python3-pil \
            qemu-system-x86 ovmf mtools dosfstools xorriso \
            python3-pefile lld llvm flex bison \
            xxd patch e2fsprogs file xz-utils

      # The build order of tools/build_shizuku_se_iso.py (BUILD_STEPS, then install/mkpayload.py), run as separate
      # steps with the same fixed SOURCE_DATE_EPOCH so the ISO builder can package them with --reuse-builds (it checks
      # every output against its build receipt). Network: the pinned FreeDOS, CSMWrap (+ SeaBIOS), Wine, FreeType and
      # Noto trees, the Open Watcom snapshot and the syslinux .debs are fetched into build/ on first use.
      - name: Build CSMWrap (SeaBIOS CSM16, external LGPL code)
        timeout-minutes: 30
        env:
          SOURCE_DATE_EPOCH: '1785283200'
        run: python3 shizukudos/csm/build.py

      - name: Build DOS16, Kernel32, Kernel64, the Win64 runtime and the UEFI loader (profile uefi-multikernel)
        timeout-minutes: 90
        env:
          SOURCE_DATE_EPOCH: '1785283200'
        run: python3 shizukudos/tools/shz.py build --profile uefi-multikernel

      - name: Build the SHZSETUP install payload with the shipped answer file
        timeout-minutes: 30
        env:
          SOURCE_DATE_EPOCH: '1785283200'
        run: python3 shizukudos/install/mkpayload.py --out build/shizukudos/install-media

      - name: Build the hybrid VM install ISO
        timeout-minutes: 30
        env:
          SOURCE_DATE_EPOCH: '1785283200'
        run: python3 tools/build_shizuku_se_iso.py --reuse-builds

      - name: Build the raw disk image
        timeout-minutes: 20
        env:
          SOURCE_DATE_EPOCH: '1785283200'
        run: python3 tools/build_shizuku_se_disk.py

      - name: Boot matrix (shz.py test --suite media, QEMU TCG, SeaBIOS and OVMF)
        # One QEMU at a time: ~25 min on a 4-CPU host with QEMU 8.2.2; runners may be slower.
        timeout-minutes: 150
        run: python3 shizukudos/tools/shz.py test --suite media

      - name: Require the VERIFIED verdict for this ISO
        # shz.py exits 0 on SKIP/BLOCKED too (verdict INCOMPLETE); a release needs every row PASS on these bytes.
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          results = json.loads(pathlib.Path("build/shizukudos/results/media-latest.json").read_text())
          print(json.dumps(results["counts"]), results["verdict"])
          if results["verdict"] != "VERIFIED" or not results["counts"].get("PASS"):
              sys.exit(f"media suite verdict {results['verdict']}: not releasing")
          evidence = {r.get("evidence") for r in results["results"] if r.get("evidence")}
          if len(evidence) != 1:
              sys.exit(f"expected one matrix run in the results, found {sorted(evidence)}")
          matrix = json.loads((pathlib.Path(evidence.pop()) / "matrix.json").read_text())
          digest = hashlib.sha256(pathlib.Path("build/windows98-shizuku-second-edition.iso").read_bytes()).hexdigest()
          if matrix["verdict"] != "PASS" or matrix["media"]["iso"]["sha256"] != digest:
              sys.exit("the boot matrix did not pass on the ISO that would be released")
          PY

      - name: Package the release assets (ISO, sha256, manifest, receipts, xz disk image, results)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          mkdir -p dist
          cp build/windows98-shizuku-second-edition.iso build/windows98-shizuku-second-edition.json \
            build/windows98-shizuku-second-edition-disk.json dist/
          (cd dist && sha256sum windows98-shizuku-second-edition.iso > windows98-shizuku-second-edition.iso.sha256)
          # The raw disk is a 128 MiB image that is mostly empty: published xz-compressed.
          xz -9 -T0 -c build/windows98-shizuku-second-edition-disk.img > dist/windows98-shizuku-second-edition-disk.img.xz
          cp build/shizukudos/results/media-latest.json dist/media-suite-results.json
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, platform, subprocess, sys

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def out(*cmd):
              r = subprocess.run(cmd, capture_output=True, text=True)
              return (r.stdout or r.stderr).strip().splitlines()[0] if r.returncode == 0 else None

          env = os.environ
          dist, build = pathlib.Path("dist"), pathlib.Path("build")
          tag, commit, repo = env["TAG"], env["GITHUB_SHA"], env["GITHUB_REPOSITORY"]
          base = f"{env['GITHUB_SERVER_URL']}/{repo}/releases/download/{tag}"
          iso = dist / "windows98-shizuku-second-edition.iso"
          receipt_path = dist / "windows98-shizuku-second-edition.json"
          receipt = json.loads(receipt_path.read_text())
          iso_sha, iso_bytes = sha256(iso), iso.stat().st_size
          if (receipt["sha256"], receipt["bytes"]) != (iso_sha, iso_bytes) or receipt["private"]:
              sys.exit("the ISO does not match its receipt, or it is a private image")
          if receipt["git"]["revision"] != commit or receipt["git"]["dirty"]:
              sys.exit(f"the ISO was built from {receipt['git']}, not from the clean commit {commit}")
          disk_raw = build / "windows98-shizuku-second-edition-disk.img"
          disk_receipt = json.loads((dist / "windows98-shizuku-second-edition-disk.json").read_text())
          disk_xz = dist / "windows98-shizuku-second-edition-disk.img.xz"
          if disk_receipt["sha256"] != sha256(disk_raw):
              sys.exit("the raw disk does not match its receipt")
          results = json.loads((dist / "media-suite-results.json").read_text())
          matrix_dir = pathlib.Path(next(r["evidence"] for r in results["results"] if r.get("evidence")))
          matrix = json.loads((matrix_dir / "matrix.json").read_text())
          (dist / "boot-matrix.json").write_text(json.dumps(matrix, indent=2) + "\n")
          ovmf_code = "/usr/share/OVMF/OVMF_CODE_4M.fd"

          def asset(path, **extra):
              return {"name": path.name, "url": f"{base}/{path.name}", "bytes": path.stat().st_size,
                      "sha256": sha256(path), **extra}

          manifest = {
              "schema": 1,
              "product": "Windows 98 Shizuku Second Edition (ShizukuDOS 10) VM install ISO",
              "tag": tag,
              "prerelease": env["PRERELEASE"] == "true",
              "repository": repo,
              "commit": commit,
              "commit_date": out("git", "log", "-1", "--format=%cI", commit),
              "build_date_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "workflow_run": f"{env['GITHUB_SERVER_URL']}/{repo}/actions/runs/{env['GITHUB_RUN_ID']}",
              "docs": f"{env['GITHUB_SERVER_URL']}/{repo}/blob/{commit}/docs/shizukudos10/RELEASE.md",
              "iso": asset(iso, sha256_file=f"{iso.name}.sha256"),
              "iso_receipt": asset(receipt_path, path="build/windows98-shizuku-second-edition.json",
                                   source_date_epoch=receipt["source_date_epoch"], volume_id=receipt["volume_id"]),
              "disk_image": asset(disk_xz, compression="xz", uncompressed={
                  "name": disk_raw.name, "bytes": disk_raw.stat().st_size, "sha256": sha256(disk_raw)},
                  receipt=asset(dist / "windows98-shizuku-second-edition-disk.json")),
              "media_suite": asset(dist / "media-suite-results.json", command="python3 shizukudos/tools/shz.py test --suite media",
                                   verdict=results["verdict"], counts=results["counts"],
                                   boot_matrix=asset(dist / "boot-matrix.json", verdict=matrix["verdict"],
                                                     hardware=matrix["hardware"])),
              "runner": {
                  "image": f"{env.get('ImageOS', 'ubuntu-24.04')} {env.get('ImageVersion', '')}".strip(),
                  "os": out("lsb_release", "-ds"), "kernel": platform.release(),
                  "qemu": out("qemu-system-x86_64", "--version"),
                  "qemu_package": out("dpkg-query", "-W", "-f=${Package} ${Version}", "qemu-system-x86"),
                  "ovmf_package": out("dpkg-query", "-W", "-f=${Package} ${Version}", "ovmf"),
                  "ovmf_code": ovmf_code, "ovmf_code_sha256": sha256(ovmf_code),
                  "accel": "tcg (no KVM)",
              },
          }
          (dist / "release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          counts = results["counts"]
          (dist / "release-notes.md").write_text(
              "Windows 98 Shizuku Second Edition (ShizukuDOS 10) VM install ISO, built and boot-tested by the "
              "`release-iso` workflow.\n\n"
              f"- Commit: `{commit}`\n"
              f"- ISO: `{iso.name}`, {iso_bytes:,} bytes\n"
              f"- SHA-256: `{iso_sha}`\n"
              f"- Boot matrix (`shz.py test --suite media`): {counts['PASS']} PASS, {counts['FAIL']} FAIL -> "
              f"{results['verdict']} ({manifest['runner']['qemu']}, TCG; OVMF {manifest['runner']['ovmf_package']})\n\n"
              f"Verify with `sha256sum -c {iso.name}.sha256`. How to boot it (QEMU legacy BIOS and UEFI, VirtualBox, "
              "VMware, Hyper-V), the browser demo options, and what the ISO does and does not contain: "
              f"[docs/shizukudos10/RELEASE.md]({manifest['docs']}).\n\n"
              "No Windows 98 files and nothing from Microsoft are on this ISO.\n\n"
              "<!-- release-iso -->\n")
          print(json.dumps(manifest, indent=2))
          PY
          ls -l dist
          {
            echo "### VM install ISO $TAG"
            echo
            echo "sha256 \`$(cut -d' ' -f1 dist/windows98-shizuku-second-edition.iso.sha256)\`, $(stat -c %s dist/windows98-shizuku-second-edition.iso) bytes"
            echo
            cat "$(python3 -c 'import json; r = json.load(open("dist/media-suite-results.json")); print(next(x["evidence"] for x in r["results"] if x.get("evidence")))')/matrix.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the release assets as a workflow artifact
        # Reachable from the run even if the release job fails.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iso-release-${{ steps.tag.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Keep the build receipts and the boot matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iso-build-evidence
          path: |
            build/*.json
            build/*.txt
            build/shizukudos/results/
            build/shizuku-se-matrix/
            build/shizuku-second-edition-evidence/
            build/shizukudos/*/build-result.json
            build/shizukudos/install-media/mkpayload-result.json
          if-no-files-found: warn

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Fetch the assets the build job verified
        # https://github.com/actions/download-artifact/releases/tag/v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iso-release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Check the assets against their hashes and this commit
        working-directory: dist
        run: |
          sha256sum -c windows98-shizuku-second-edition.iso.sha256
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open("release-manifest.json"))
          if (m["commit"], m["tag"]) != (os.environ["GITHUB_SHA"], os.environ["TAG"]):
              sys.exit(f"manifest is for {m['tag']} at {m['commit']}")
          PY

      - name: Refuse a tag that points at another commit
        run: |
          # Resolve refs/tags/$TAG exactly (git/ref, not the prefix-matching git/refs), peeling annotated tags. Only a
          # 404 means "no such tag" (the release below then creates it at this commit); any other error stops here.
          if ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2> gh-error.txt); then
            read -r type obj <<< "$ref"
            while [ "$type" = tag ]; do
              read -r type obj <<< "$(gh api "repos/$GH_REPO/git/tags/$obj" --jq '.object.type + " " + .object.sha')"
            done
            if [ "$obj" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG points at $obj, but these assets were built from $GITHUB_SHA"
              exit 1
            fi
            echo "tag $TAG exists at $obj"
          elif grep -q 'HTTP 404' gh-error.txt; then
            echo "tag $TAG does not exist yet: the release creates it at $GITHUB_SHA"
          else
            cat gh-error.txt
            exit 1
          fi

      - name: Create or update the release and upload the assets
        run: |
          assets=(
            dist/windows98-shizuku-second-edition.iso
            dist/windows98-shizuku-second-edition.iso.sha256
            dist/release-manifest.json
            dist/windows98-shizuku-second-edition.json
            dist/windows98-shizuku-second-edition-disk.img.xz
            dist/windows98-shizuku-second-edition-disk.json
            dist/media-suite-results.json
            dist/boot-matrix.json
          )
          title="Windows 98 Shizuku Second Edition VM install ISO ($TAG)"
          # A full release is marked Latest, so releases/latest/download/<asset> serves it. GitHub never makes a
          # prerelease the Latest release.
          if [ "$PRERELEASE" = true ]; then latest=(); else latest=(--latest); fi
          if body=$(gh release view "$TAG" --json body --jq .body 2> /dev/null); then
            gh release upload "$TAG" "${assets[@]}" --clobber
            if grep -qF '<!-- release-iso -->' <<< "$body"; then
              gh release edit "$TAG" --title "$title" --notes-file dist/release-notes.md --draft=false \
                --prerelease="$PRERELEASE" "${latest[@]}"
            else
              # Made by hand or by another workflow: add the assets, keep its title, notes and flags.
              echo "::notice::release $TAG was not created by this workflow: assets uploaded, title/notes/flags unchanged"
            fi
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$title" \
              --notes-file dist/release-notes.md --prerelease="$PRERELEASE" "${latest[@]}"
          fi
          gh release view "$TAG" --json url,isPrerelease,assets \
            --jq '"\(.url) prerelease=\(.isPrerelease)\n" + ([.assets[] | "  \(.name) \(.size)"] | join("\n"))'
